[project]
name = "flare-nrt"
version = "0.9.0"
description = "Near-real-time solar flare detection on SDO/AIA synoptic images (HelioUSACH)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "astropy>=6.0",
    "torch>=2.2",
    "torchvision>=0.17",
    "requests>=2.31",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[tool.setuptools]
packages = ["flare_nrt"]

[tool.setuptools.package-data]
flare_nrt = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests", "."]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
